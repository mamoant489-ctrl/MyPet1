plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.mypet'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.example.mypet"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures{
        viewBinding true
    }
}


dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.firebase.auth
    implementation libs.credentials
    implementation libs.credentials.play.services.auth
    implementation libs.googleid
    implementation libs.firebase.database
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics

    implementation platform(libs.firebase.bom.v3270)
    implementation libs.firebase.firestore
    implementation libs.firebase.storage
    implementation libs.google.firebase.auth
    implementation libs.play.services.auth

    implementation libs.circularimageview
    implementation libs.glide
    implementation 'com.google.firebase:firebase-storage:20.3.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation libs.viewpager2
    implementation libs.github.glide.v4160


    implementation libs.osmdroid.android
    implementation libs.play.services.location
    implementation libs.firebase.database.v2030
    implementation libs.firebase.auth.v2231
    implementation libs.recyclerview
    implementation libs.google.material.v1110
    implementation libs.multidex


}

apply plugin: 'com.google.gms.google-services'